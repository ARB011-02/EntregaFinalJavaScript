<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TiendaTech | Simulador de compra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar bg-dark navbar-dark px-3">
    <span class="navbar-brand mb-0 h1">🛒 TiendaTech</span>
    <span class="text-white-50 small">Simulador de compra online</span>
  </header>

  <main class="container py-4">
    <div class="row g-4">
      <section class="col-lg-8">
        <div class="row g-2 mb-3">
          <div class="col-md-7">
            <input id="buscador" type="search" class="form-control" placeholder="Buscar producto...">
          </div>
          <div class="col-md-5">
            <select id="filtroCategoria" class="form-select" aria-label="Filtrar por categoría"></select>
          </div>
        </div>
        <div id="estadoCarga" class="text-center py-5">
          <div class="spinner-border" role="status"></div>
          <p class="mt-2">Cargando productos...</p>
        </div>
        <div id="productos" class="row g-3"></div>
      </section>

      <aside class="col-lg-4">
        <div class="card shadow-sm sticky-top carrito">
          <div class="card-header fw-bold">Tu carrito</div>
          <div id="carrito" class="card-body"></div>
          <div class="card-footer">
            <div class="d-flex justify-content-between fw-bold mb-2">
              <span>Total</span><span id="total">$0</span>
            </div>
            <button id="botonConfirmar" class="btn btn-success w-100 mb-2">Confirmar compra</button>
            <button id="botonVaciar" class="btn btn-outline-danger w-100">Vaciar carrito</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
